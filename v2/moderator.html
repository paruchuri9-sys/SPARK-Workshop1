<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPARK Moderator</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="header-row"><div class="brand"><strong>SPARK Moderator</strong><span>Data Center Decision Under Uncertainty</span></div><div id="authStatus" class="muted">Not signed in</div></div></header><main><div class="card"><div class="grid"><div><label>Session ID</label><input id="sessionId" value="demo"></div><div><label>&nbsp;</label><button id="googleSignIn" class="primary">Sign in with Google</button></div></div></div><section id="controls" hidden><div class="mod-grid"><div class="card"><h2>Session control</h2><p>Current unlocked tab: <strong id="currentTabLabel"></strong></p><div class="actions"><button id="prev" class="secondary">Previous focus</button><button id="next" class="primary">Unlock next tab</button></div><h3>Timer</h3><div id="timer" class="timer">--:--</div><div class="actions"><button id="startTimer" class="primary">Start stage timer</button><button id="pauseTimer" class="secondary">Pause</button><button id="addMinute" class="secondary">+1 min</button><button id="resetTimer" class="secondary">Reset</button></div><h3>Responses</h3><label class="choice"><input id="lockResponses" type="checkbox"> <span>Lock new/edited responses</span></label></div><div class="card"><h2>Live status</h2><p><strong id="presence">0</strong> participants online</p><p><strong id="responseCount">0</strong> participant records stored</p><button id="refreshSummary" class="secondary">Compute current summary</button><div id="summary" style="margin-top:12px"></div><button id="publishSummary" class="primary" style="margin-top:12px">Publish summary to current tab</button></div></div><div class="card"><h2>Facilitation layer</h2><div id="facilitation"></div></div></section></main><script type="module" src="moderator.js"></script></body></html>
