AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SPARK Discover-Select-Develop prototype

Parameters:
  ExistingUploadBucket:
    Type: String
    Description: Existing S3 bucket used for Alpha 1 uploads/artifacts.

Resources:
  SparkData:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  SparkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: app.main.handler
      Runtime: python3.12
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          SPARK_STORAGE: aws
          SPARK_TABLE: !Ref SparkData
          SPARK_UPLOAD_BUCKET: !Ref ExistingUploadBucket
          SPARK_UPLOAD_PREFIX: spark-alpha1
          OPENAI_MODEL: gpt-5.6-sol
          OPENAI_SECRET_ID: SPARK/OpenAIApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SparkData
        - S3CrudPolicy:
            BucketName: !Ref ExistingUploadBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:SPARK/OpenAIApiKey-*'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

Outputs:
  AppUrl:
    Value:
      Fn::GetAtt: SparkFunctionUrl.FunctionUrl
  DataTable:
    Value: !Ref SparkData
  UploadBucket:
    Value: !Ref ExistingUploadBucket
