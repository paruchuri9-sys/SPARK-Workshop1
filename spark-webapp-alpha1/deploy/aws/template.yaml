AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SPARK Discover-Select-Develop prototype
Resources:
  SparkData:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
  SparkUploads:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  SparkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: app.main.handler
      Runtime: python3.12
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          SPARK_STORAGE: aws
          SPARK_TABLE: !Ref SparkData
          SPARK_UPLOAD_BUCKET: !Ref SparkUploads
          OPENAI_MODEL: gpt-5.6-sol
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SparkData
        - S3CrudPolicy:
            BucketName: !Ref SparkUploads
      Events:
        Root:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootExact:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
Outputs:
  AppUrl:
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/'
  DataTable:
    Value: !Ref SparkData
  UploadBucket:
    Value: !Ref SparkUploads
