<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#582C83" />
  <title>SPARK Workshop 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brandmark" aria-hidden="true">SPARK</div>
  <div>
    <div class="eyebrow">University of Central Arkansas</div>
    <h1>SPARK Workshop 1</h1>
  </div>
  <div class="header-right">
    <span id="roleBadge" class="badge">Teacher / Player</span>
    <span id="connectionBadge" class="badge secondary">Preview</span>
  </div>
</header>

<main class="shell">
  <section id="joinView" class="card join-card">
    <h2>Join the activity</h2>
    <p class="muted">Enter your participant code and assigned group.</p>
    <div class="grid two">
      <label>Participant code
        <input id="participantCode" autocomplete="off" placeholder="e.g., P12" />
      </label>
      <label>Group
        <select id="groupId"></select>
      </label>
    </div>
    <input id="isRecorder" type="hidden" value="" />
    <button id="joinBtn" class="primary">Enter workshop</button>
  </section>

  <section id="workshopView" class="hidden">
    <div class="stagebar card compact">
      <div>
        <div class="eyebrow" id="stageKicker">Stage 1 of 10</div>
        <h2 id="stageTitle">Starting Record</h2>
      </div>
      <div class="timerbox" aria-live="polite">
        <span class="timer-label">Time remaining</span>
        <span id="timer">--:--</span>
      </div>
    </div>
    <div id="promptBanner" class="prompt-banner hidden"></div>
    <div id="stageContent"></div>
    <div class="stage-actions"><span id="saveState" class="muted"></span></div>
  </section>

  <section id="facilitatorView" class="hidden"></section>
  <section id="synthesisView" class="hidden"></section>
</main>

<script src="config.js"></script>
<script src="scenario-data.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="patch.js"></script>
<script src="patch2.js"></script>
<script src="patch3.js"></script>
<script src="patch4.js"></script>
<script src="patch5.js"></script>
<script src="patch6.js"></script>
<script src="patch7.js"></script>
<script src="review.js"></script>
</body>
</html>
