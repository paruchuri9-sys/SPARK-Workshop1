<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#582C83" />
  <title>SPARK Workshop 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brandmark" aria-hidden="true">SPARK</div>
  <div><div class="eyebrow">University of Central Arkansas</div><h1>SPARK Workshop 1</h1></div>
  <div class="header-right"><span id="roleBadge" class="badge">Teacher / Player</span><span id="connectionBadge" class="badge secondary">Checking connection</span></div>
</header>
<main class="shell">
  <section id="joinView" class="card join-card">
    <h2>Join the activity</h2>
    <p class="muted">Enter your name, choose your role, then select your assigned Zoom breakout room.</p>
    <label>Full name<input id="participantName" autocomplete="name" placeholder="First and last name"></label>
    <label>Role<select id="entryRole"><option value="participant">Participant</option><option value="moderator">Moderator</option></select></label>
    <div id="moderatorCodeWrap" class="hidden"><label>Moderator code<input id="moderatorCode" type="password" autocomplete="off" placeholder="Enter moderator code"></label></div>
    <label>Your breakout group</label>
    <div id="groupCards"></div>
    <button id="joinBtn" class="primary join-action">Enter workshop</button>
  </section>
  <section id="workshopView" class="hidden">
    <div class="stagebar card compact">
      <div><div class="eyebrow" id="stageKicker">Phase 1 of 10</div><h2 id="stageTitle">Starting Record</h2></div>
      <div class="timerbox" aria-live="polite"><span class="timer-label">Time remaining</span><span id="timer">--:--</span></div>
    </div>
    <div id="promptBanner" class="prompt-banner hidden"></div>
    <div id="stageContent"></div>
  </section>
  <section id="waitingView" class="hidden"></section>
  <section id="facilitatorView" class="hidden"></section>
</main>
<script src="config.js"></script>
<script src="scenario-data.js"></script>
<script src="app5.js?v=7"></script>
<script src="moderator-lite.js?v=2"></script>
<script src="manual-flow.js?v=1"></script>
</body>
</html>
