<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#582C83" />
  <title>SPARK Workshop 1 · Moderator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brandmark" aria-hidden="true">SPARK</div>
  <div><div class="eyebrow">University of Central Arkansas</div><h1>Workshop 1 · Moderator</h1></div>
  <div class="header-right"><span class="badge">Moderator</span></div>
</header>
<main class="shell">
  <section class="card join-card">
    <h2>Moderator entry</h2>
    <p class="muted">Select the breakout group you are moderating. Each moderator controls only that group's phase releases.</p>
    <label>Your assigned group</label>
    <div class="group-cards" id="modGroups">
      <button type="button" class="group-card" data-group="Owl"><span class="group-emoji">🦉</span><span>Owl</span></button>
      <button type="button" class="group-card" data-group="Fox"><span class="group-emoji">🦊</span><span>Fox</span></button>
      <button type="button" class="group-card" data-group="Raven"><span class="group-emoji">🐦‍⬛</span><span>Raven</span></button>
      <button type="button" class="group-card" data-group="Dolphin"><span class="group-emoji">🐬</span><span>Dolphin</span></button>
      <button type="button" class="group-card" data-group="Octopus"><span class="group-emoji">🐙</span><span>Octopus</span></button>
    </div>
    <label>Moderator key<input id="modKey" type="password" autocomplete="off" placeholder="Enter moderator key"></label>
    <button id="enterModerator" class="primary join-action">Open moderator controls</button>
    <p id="modError" class="muted" aria-live="polite"></p>
  </section>
</main>
<script src="config.js"></script>
<script>
(function(){
 let group='';
 const cards=[...document.querySelectorAll('.group-card')];
 cards.forEach(b=>b.onclick=()=>{group=b.dataset.group;cards.forEach(x=>x.classList.toggle('selected',x===b));});
 document.getElementById('enterModerator').onclick=()=>{
   const key=document.getElementById('modKey').value;
   if(!group){document.getElementById('modError').textContent='Select your assigned group.';return;}
   if(key!==window.SPARK_CONFIG.MODERATOR_KEY){document.getElementById('modError').textContent='Incorrect moderator key.';return;}
   location.href=`./?role=moderator&group=${encodeURIComponent(group)}&key=${encodeURIComponent(key)}`;
 };
})();
</script>
</body>
</html>
