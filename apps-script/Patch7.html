<script>
(function(){
  if(window.SPARK_DATA){
    D.decisions=[
      'Proceed under current requirements',
      'Proceed with project-specific conditions',
      'Defer pending specific studies/information',
      'Oppose the project'
    ];
  }

  function clearGroupChoice(votes){
    const vals=Object.values(votes||{}).filter(v=>v&&v.choice);
    const total=vals.length;
    if(!total)return '';
    const dist=Object.fromEntries(D.decisions.map(x=>[x,0]));
    vals.forEach(v=>{if(Object.prototype.hasOwnProperty.call(dist,v.choice))dist[v.choice]++;});
    const max=Math.max(...Object.values(dist));
    const winners=D.decisions.filter(x=>dist[x]===max&&max>0);
    if(max===total)return winners[0]||'';
    if(winners.length===1 && max>total/2)return winners[0];
    return '';
  }
  function challengeFor(choice){
    if(choice==='Proceed under current requirements' || choice==='Proceed with project-specific conditions') return 'Defer pending specific studies/information';
    if(choice==='Defer pending specific studies/information' || choice==='Oppose the project') return 'Proceed with project-specific conditions';
    return '';
  }

  if(typeof stageHtml==='function'){
    const priorStageHtml=stageHtml;
    stageHtml=function(n){
      let html=priorStageHtml(n);
      if(n===1){
        const note='<div class="instruction"><strong>Decision tradeoff:</strong> Delay could reduce risk, but it could also mean losing the project and potential follow-on investment.</div>';
        html=html.replace('</div></section><section class="card stage-card"><h3>Individual first impression</h3>',`</div>${note}</section><section class="card stage-card"><h3>Individual first impression</h3>`);
      }
      if(n===7){
        const current=clearGroupChoice(server.votes?.s6||{}) || clearGroupChoice(server.votes?.s5||{});
        const assigned=challengeFor(current);
        if(assigned){
          const opts=D.decisions.map(x=>`<option value="${esc(x)}" ${x===assigned?'selected':''}>${esc(x)}</option>`).join('');
          html=html.replace(/<label>Alternative recommendation<select id="altChoice"[\s\S]*?<\/select><\/label>(?:<p class="muted">[\s\S]*?<\/p>)?/,
            `<label>Alternative recommendation<select id="altChoice" aria-label="Assigned alternative recommendation">${opts}</select></label><p class="muted">Because the group's current recommendation is <strong>${esc(current)}</strong>, this challenge tests <strong>${esc(assigned)}</strong>.</p>`);
        }
      }
      if(n===8){
        html=html.replace('If the group favors Proceed / Proceed with conditions, identify 2–4 enforceable conditions. If it favors Defer / Oppose, identify what evidence or change could reopen the decision.',
          'If the group favors proceeding, identify 2–4 enforceable conditions or requirements. If it favors deferring or opposing, identify what evidence or change could reopen the decision.');
      }
      return html;
    };
  }
})();
</script>
