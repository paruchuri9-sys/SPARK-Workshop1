<style>
.choice{margin:0;display:flex!important;align-items:center;gap:10px;border:2px solid #cfc7d5;border-radius:10px;padding:12px;background:#fff;font-weight:700;cursor:pointer}
.choice input{position:static!important;opacity:1!important;pointer-events:auto!important;width:18px!important;height:18px!important;margin:0!important;accent-color:#582C83;flex:0 0 auto}
.choice span{display:block!important;border:0!important;padding:0!important;background:transparent!important;box-shadow:none!important}
.choice:has(input:checked){border-color:#582C83;background:#f1edf5;box-shadow:0 0 0 2px rgba(88,44,131,.12)}
#facGroup{display:none!important}
.plain-note{font-size:.9rem;color:#514b58;background:#f7f5f8;border-radius:8px;padding:9px 11px;margin:8px 0}
</style>
<script>
(function(){
  if(window.SPARK_DATA){
    const D=window.SPARK_DATA;
    D.startingFacts=[
      "The first building would be about 300,000 square feet.",
      "The developer expects about $1 billion in initial construction and equipment investment.",
      "The project is expected to create about 50 permanent jobs, plus temporary construction jobs.",
      "The agreement would reduce normal property taxes on covered project property by at least 65% for 30 years.",
      "More data-center buildings could be added later if business and market conditions support expansion.",
      "About 160 acres have been rezoned from agricultural use to intensive industrial use.",
      "The main cooling system is planned to use treated wastewater instead of drinking water.",
      "The project would require new water pipes, a cooling-water discharge line, road work, utility connections and major electric infrastructure.",
      "The local utility could provide up to 10 megawatts (MW) for support equipment. The main computing equipment would need a separate connection to the regional high-voltage power grid and could use much more power.",
      "Some final costs, construction timing, utility requirements and project details are still unsettled."
    ];
    if(D.evidence?.A){D.evidence.A.facts=["The public agreement describes about $1 billion in initial investment and about 50 permanent jobs.","The agreement reduces normal property taxes on covered project property by at least 65% for 30 years. In simple terms, the project would pay no more than about 35% of the ordinary property-tax amount on that covered property before considering other payments or fees.","The company must also make an annual contribution to a local foundation, but the public agreement excerpt used here does not state the amount.","The city would receive a fee tied to the project's high-voltage electricity service."];D.evidence.A.unknowns=["How much tax revenue would the city, county, schools and other local entities actually receive after the tax break?","How many construction jobs would there be, how long would they last, and what would they pay?","What would the permanent jobs pay, what skills would they require, and how many could be filled locally?","How large would the annual community contribution be?","Would the developer have to repay incentives or lose benefits if promised investment, jobs or community benefits do not occur?"];}
    if(D.evidence?.B){D.evidence.B.facts=["The local utility's planned connection could provide up to 10 megawatts (MW) for support equipment such as offices and site systems.","The main computing equipment would use a separate high-voltage connection to the regional transmission grid. The technical voltage level is not important for this activity; what matters is that this is a much larger grid connection than ordinary local service.","Later public reporting has described the eventual data-center demand as potentially up to 1,000 MW. That is a reported estimate, not a guaranteed or contractual amount in the original agreement.","The city would receive a fee tied to the high-voltage electricity service."];D.evidence.B.unknowns=["How much electricity would the first phase actually need, and how quickly could demand grow?","What new substations, transmission lines or power generation would be needed?","Who would pay for project-specific upgrades and cost overruns?","Could the project change electricity rates or reliability for current homes and businesses?","Would the project use backup generation, batteries, renewable power or agreements to reduce demand during grid stress?","Has an independent grid-impact or customer-rate study been completed?"];D.evidence.B.source="10 MW and the separate high-voltage grid connection are in the public agreement. The possible 1,000 MW scale is later public reporting. MW measures the rate of power use at a moment; it is not the same as annual energy use.";}
    if(D.evidence?.C){D.evidence.C.facts=["The main cooling plan uses treated wastewater from a wastewater-treatment plant instead of drinking water.","A new pump station and pipe would move the treated wastewater to the data-center site.","Some water must periodically be removed from a cooling system to control mineral buildup. That discharge water would travel through a separate pipe to the Arkansas River and would require environmental permits.","The local utility reports that its two wastewater plants together can treat up to 22.4 million gallons per day.","The utility says drinking water would be used mainly for normal building needs, not for the main cooling system, if the project proceeds."];D.evidence.C.unknowns=["How many gallons of cooling water would the first phase actually need on a normal day and on the hottest days?","How much water would be lost to evaporation, and how much would be returned to the river?","How much treated wastewater is reliably available at the relevant treatment plant during dry or peak conditions?","What temperature and water-quality limits would apply to the discharged cooling water?","What happens if the project expands or a drought reduces available water?","Should an independent regional water study be required before later phases?"];}
    if(D.evidence?.D){D.evidence.D.facts=["The project would need new cooling-water pipes, a discharge pipe, electric service, fiber connections, utility extensions and road work, including relocation of part of Lollie Road.","The original agreement says the schedule and who pays for several major infrastructure improvements were still being negotiated.","City planning staff noted that an operating data center would usually create less daily traffic than many other large industrial uses, but construction traffic was not quantified.","Land brought into the city would also rely on city services such as police, fire, streets and sanitation."];D.evidence.D.unknowns=["Which construction and infrastructure costs would be paid by the developer, the utility, the city or existing customers?","Where would construction trucks travel, how long would construction last, and what road or neighborhood disruptions could occur?","What additional fire, emergency-response or water-pressure capacity would be needed?","Could a large temporary construction workforce affect local housing or services?","Would the developer provide bonds, repayment protections or money for eventual site shutdown and cleanup?"];}
    if(D.evidence?.E){D.evidence.E.facts=["About 160 acres were rezoned from agricultural use to intensive industrial use.","City planning records say industrial use generally fits the surrounding zoning, while some nearby land is in mapped flood-risk areas.","The city's data-center noise rules require a sound study before construction, a plan to reduce noise, another study when the cooling/mechanical equipment is fully operating, and yearly testing afterward.","The rules set measurable daytime and nighttime sound limits at neighboring property lines.","Any future expansion would also have to meet the noise rules."];D.evidence.E.unknowns=["What would the final site plan mean for flooding, drainage and stormwater?","How much noise would nearby residents actually hear, including low-frequency hum?","What effects could come from lighting, backup generators, waste heat, wildlife or neighboring land uses?","Should later expansion trigger a fresh environmental or site review?","Which environmental and neighborhood conditions should be measured after the facility opens?"];}
    if(D.evidence?.F){D.evidence.F.facts=["The city held a public meeting in May 2026 because residents still had questions and officials said they did not yet have every answer.","The project agreement was initially marked as confidential business information before becoming publicly accessible.","The developer named in the agreement is Forgelight Ventures, LLC. The company that would ultimately operate the data center was not identified in the official record used for this activity.","Public discussion has included electricity rates, water, environmental effects, transparency, speed of approval, noise, project size and economic benefits."];D.evidence.F.unknowns=["What information should the public receive before a major decision is made?","Which information is legitimately confidential, and for how long?","How should community questions and disagreement affect the decision?","Should independent technical experts help the community and developer agree on disputed facts?","Does the identity and track record of the eventual operator materially change the risk?","How should minority concerns be preserved even if most participants favor one option?"];}
    if(D.evidence?.G){D.evidence.G.facts=["The agreement allows possible future buildings, and some infrastructure details would be handled in later agreements.","The city already has at least one example of measurable oversight: its noise rules require independent studies and yearly testing.","Several utility and infrastructure obligations were not fully settled in the original agreement.","The city can attach requirements through ordinances, site-plan approval, utility agreements, road-use agreements and permits."];D.evidence.G.unknowns=["Which requirements must be satisfied before approval instead of being negotiated later?","What measurable milestones should apply to investment, jobs, infrastructure, water, electricity and expansion?","What happens if the developer misses a commitment: repayment, delay, suspension or something else?","Would the same obligations still apply if the project is sold to another company?","Who would independently monitor performance and what information would be public?","Who pays for shutdown, removal or cleanup if the facility eventually closes?","Should each future expansion phase require a new review?"];}
    D.stage6Update=["Later reporting says the project's eventual electricity demand could be much larger than the local 10 MW support connection, potentially reaching as high as 1,000 MW through the regional grid. This is a reported estimate, not a guaranteed final demand.","The cooling plan still uses treated wastewater, and the utility says drinking water would be used mainly for normal building needs rather than the main cooling system.","Later reporting says the developer would pay for additional cooling-water infrastructure, reducing one earlier uncertainty about who pays.","Future expansion is still possible, while exact cooling-water demand, the pace of electricity growth, several final infrastructure terms and the eventual operator remain unresolved.","The city's existing noise rules would require studies before operation, at full operation and annually afterward."];
  }
  if(typeof stakeholderHtml==='function') stakeholderHtml=function(){return ''};
  if(typeof stageHtml==='function'){
    const oldStageHtml=stageHtml;stageHtml=function(n){let html=oldStageHtml(n);if(n===1){html=html.replace('Treat the information below as the <strong>current project record</strong>. It is not necessarily complete. You may question meaning, sufficiency, assumptions, source quality and what still needs verification.','<strong>Starting record:</strong> The following information is currently available to the Community Advisory Team. Read it before making your initial recommendation.');html=html.replace('</div></section><section class="card stage-card"><h3>Individual first impression</h3>','</div><div class="plain-note"><strong>Quick term:</strong> A megawatt (MW) measures how much electrical power is being used at a moment. You do not need electrical-engineering knowledge for this activity.</div></section><section class="card stage-card"><h3>Individual first impression</h3>');}return html;};
  }
  if(typeof recorderOnly==='function'){recorderOnly=function(html){if(session.recorder)return html;const who=server.recorder?`<strong>${esc(server.recorder)}</strong> is the group recorder.`:'The facilitator will assign a recorder when group entry is needed.';return `<div class="callout"><strong>Group discussion:</strong> ${who} Everyone participates; only the recorder enters the shared group artifact.</div>`;};}

  let lastUiFingerprint='';
  function participantFingerprint(s){const stage=s?.stage||1;const stageVotes=(stage===5||stage===6||stage===8)?(s?.votes?.[`s${stage}`]||{}):{};return JSON.stringify({stage,prompt:s?.prompt||'',recorder:s?.recorder||'',evidence:s?.selectedEvidence||[],votes:stageVotes});}
  function snapshotInputs(){const out=[];document.querySelectorAll('#stageContent input,#stageContent textarea,#stageContent select').forEach((el,i)=>{const key=el.id||el.dataset.key||`${el.name||el.tagName}_${i}`;out.push({key,type:el.type,name:el.name,value:el.value,checked:el.checked});});return out;}
  function restoreInputs(items){items.forEach(x=>{let el=x.key&&document.getElementById(x.key);if(!el&&x.name&&x.type==='radio')el=[...document.querySelectorAll(`#stageContent input[name="${CSS.escape(x.name)}"]`)].find(e=>e.value===x.value);if(!el&&x.key)el=document.querySelector(`#stageContent [data-key="${CSS.escape(x.key)}"]`);if(!el)return;if(x.type==='radio'||x.type==='checkbox')el.checked=x.checked;else el.value=x.value;if(el.type==='range'){const v=document.getElementById(el.id+'v');if(v)v.textContent=`${el.value} / 100`;}});}
  if(typeof refreshState==='function'){
    refreshState=async function(){const oldStage=server?.stage||1,saved=snapshotInputs(),r=await callApi('state',{group:session.group,participant:session.participant});if(!r.state)return;const next=r.state;session.recorder=next.recorder===session.participant;const fp=participantFingerprint(next),needsRender=(fp!==lastUiFingerprint);server=next;if(needsRender){renderParticipant();if(oldStage===server.stage)restoreInputs(saved);lastUiFingerprint=fp;}};
  }

  if(typeof renderFacilitator==='function'){
    const oldRenderFacilitator=renderFacilitator;renderFacilitator=function(){oldRenderFacilitator();const selector=document.querySelector('#facGroup');if(selector)selector.remove();const firstCard=document.querySelector('#facilitatorView section.card');if(!firstCard)return;const row=document.createElement('div');row.className='fac-toolbar';row.style.marginTop='14px';const options=(server.participants||[]).map(p=>`<option value="${esc(p.participant)}" ${server.recorder===p.participant?'selected':''}>${esc(p.participant)}</option>`).join('');row.innerHTML=`<strong>Group ${esc(session.group)} recorder:</strong><select id="recorderAssign"><option value="">Not assigned</option>${options}</select><button class="secondary-btn" id="assignRecorderBtn">Assign recorder</button><span class="muted">Assign after participants join; it does not need to be decided before the workshop starts.</span>`;firstCard.appendChild(document.createElement('hr'));firstCard.appendChild(row);document.querySelector('#assignRecorderBtn').onclick=async()=>{await callApi('facilitator',{group:session.group,patch:{recorder:document.querySelector('#recorderAssign').value}});await facilitatorState();};};
  }
  try{if(session?.role==='participant'&&document.querySelector('#workshopView')&&!document.querySelector('#workshopView').classList.contains('hidden')){lastUiFingerprint='';refreshState();}if(session?.role==='facilitator'&&document.querySelector('#facilitatorView')&&!document.querySelector('#facilitatorView').classList.contains('hidden'))renderFacilitator();}catch(e){console.warn('SPARK patch initialization deferred',e)}
})();
</script>
