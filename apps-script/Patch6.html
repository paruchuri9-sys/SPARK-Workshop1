<script>
(function(){
  if(typeof stageHtml==='function'){
    const priorStageHtml=stageHtml;
    stageHtml=function(n){
      let html=priorStageHtml(n);
      if(n===6){
        html=html.replace('Several months later, additional information becomes available. Some uncertainty is reduced while other uncertainty grows.','Additional information becomes available. Some uncertainty is reduced while other uncertainty grows.');
        html=html.replace('<p><strong>Does this strengthen, weaken, or leave unchanged your recommendation?</strong> You are not expected to change your position.</p>','<p><strong>Does this information strengthen, weaken, or leave your recommendation unchanged?</strong></p>');
      }
      return html;
    };
  }
})();
</script>
