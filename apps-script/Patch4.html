<script>
(function(){
  if(typeof recorderOnly==='function'){
    recorderOnly=function(html){return `<div class="callout"><strong>Group response:</strong> Discuss together. Anyone in the group may enter or edit the shared response. Decide naturally who will type.</div>${html}`;};
  }

  if(typeof evidenceCard==='function'){
    evidenceCard=function(id){
      const e=D.evidence[id];if(!e)return '';
      const facts=e.facts||[],unknowns=e.unknowns||[],vf=facts.slice(0,3),ef=facts.slice(3),vu=unknowns.slice(0,2),eu=unknowns.slice(2);
      const more=(ef.length||eu.length)?`<details><summary>More detail</summary>${ef.length?`<strong>Additional information</strong><ul>${ef.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${eu.length?`<strong>Other unresolved questions</strong><ul>${eu.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="source-note"><strong>Source status:</strong> ${esc(e.source||'')}</div></details>`:`<div class="source-note"><strong>Source status:</strong> ${esc(e.source||'')}</div>`;
      return `<article class="evidence-card"><h4>${id}. ${esc(e.title)}</h4><div class="source-note"><strong>Quick read</strong></div><ul>${vf.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><strong>Questions that still matter</strong><ul>${vu.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${more}</article>`;
    };
  }

  if(typeof stageHtml==='function'){
    const prior=stageHtml;
    stageHtml=function(n){let html=prior(n);if([2,3,4,5,7,8,9,10].includes(n))html=html.replace('<section class="card stage-card">','<section class="card stage-card"><div class="plain-note"><strong>Shared group work:</strong> Your group decides how to enter one shared response; no recorder is assigned.</div>');if(n===3)html=html.replace('Lock evidence selection','Confirm group evidence choice');return html;};
  }

  if(typeof renderFacilitator==='function'){
    const prior=renderFacilitator;
    renderFacilitator=function(){
      prior();const view=document.querySelector('#facilitatorView');if(!view)return;
      document.querySelector('#roleBadge').textContent='Moderator';
      view.querySelector('#facGroup')?.remove();
      view.querySelector('#recorderAssign')?.closest('.fac-toolbar')?.remove();
      view.querySelectorAll('.metric').forEach(m=>{if(/ready/i.test(m.textContent))m.remove();});
      const bar=view.querySelector('.stagebar .eyebrow');if(bar)bar.textContent=`Moderator · Group ${session.group}`;
      const next=view.querySelector('#nextStage'),prev=view.querySelector('#prevStage');
      if(next){if(!server.started){next.textContent='Start scenario →';next.onclick=()=>facPatch({started:true,stage:1});if(prev)prev.disabled=true;}else{next.textContent=server.stage>=STAGES.length?'Final phase active':'Start next phase →';next.disabled=server.stage>=STAGES.length;if(server.stage<STAGES.length)next.onclick=()=>facPatch({stage:server.stage+1});}}
      if(!server.started){const h=view.querySelector('.stagebar h2');if(h)h.textContent='Waiting to start scenario';const timer=view.querySelector('#timer');if(timer)timer.textContent='--:--';}
    };
  }
})();
</script>
