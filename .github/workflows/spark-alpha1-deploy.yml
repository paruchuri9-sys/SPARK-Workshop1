name: Deploy SPARK Alpha 1

on:
  push:
    branches:
      - spark-webapp-alpha1
    paths:
      - "spark-webapp-alpha1/**"
      - ".github/workflows/spark-alpha1-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949163302310:role/SAIL-GitHub-Deploy
          aws-region: us-east-1

      - name: Resolve existing deployment bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name SAIL-Alpha2-Telemetry \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='TelemetryBucketName'].OutputValue" \
            --output text)
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "Existing S3 bucket not found" >&2
            exit 1
          fi
          echo "SPARK_EXISTING_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Remove failed rollback stack if present
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name SPARK-Alpha1-WebApp \
            --region us-east-1 \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Deleting failed stack in ROLLBACK_COMPLETE state"
            aws cloudformation delete-stack \
              --stack-name SPARK-Alpha1-WebApp \
              --region us-east-1
            aws cloudformation wait stack-delete-complete \
              --stack-name SPARK-Alpha1-WebApp \
              --region us-east-1
          fi

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Build
        run: sam build --template-file spark-webapp-alpha1/deploy/aws/template.yaml

      - name: Deploy
        id: deploy
        continue-on-error: true
        run: |
          sam deploy \
            --stack-name SPARK-Alpha1-WebApp \
            --region us-east-1 \
            --s3-bucket "$SPARK_EXISTING_BUCKET" \
            --s3-prefix "spark-alpha1/deploy" \
            --parameter-overrides ExistingUploadBucket="$SPARK_EXISTING_BUCKET" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Diagnose SPARK stack
        if: steps.deploy.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events \
            --stack-name SPARK-Alpha1-WebApp \
            --region us-east-1 \
            --query 'StackEvents[0:40].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
            --output table || true
          exit 1
