name: SPARK Apps Script controlled deploy
on:
  workflow_dispatch:
    inputs:
      source:
        type: choice
        required: true
        options: [main, spark-mvp-design-0.3-reasoner-0.3]
      release_note:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: spark-apps-script-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: spark-production
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Checkout selected application source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source }}
          path: selected-source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate selected release
        run: |
          cp apps-script-mvp/appsscript.json selected-source/apps-script-mvp/appsscript.json
          cd selected-source
          node ../scripts/check-spark-release.mjs
      - run: npm install --global @google/clasp@3
      - name: Prepare secure clasp mapping
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SPARK_SCRIPT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          mkdir -p .spark-clasp
          cp selected-source/apps-script-mvp/Code.gs selected-source/apps-script-mvp/Index.html apps-script-mvp/appsscript.json .spark-clasp/
          node -e "require('fs').writeFileSync('.spark-clasp/.clasp.json',JSON.stringify({scriptId:process.env.SCRIPT_ID,rootDir:'.'}))"
      - name: Preflight target and record current deployment
        working-directory: .spark-clasp
        env:
          DEPLOYMENT_ID: ${{ secrets.SPARK_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          clasp deployments > ../spark-deployments-before.txt
          if ! grep -Fq "$DEPLOYMENT_ID" ../spark-deployments-before.txt; then
            echo "::error::Deployment ID not found in the authorized Script ID. No release published."
            exit 1
          fi
          echo "Target deployment belongs to the authenticated Apps Script project." >> "$GITHUB_STEP_SUMMARY"
          echo "Record previous deployment version from Apps Script Manage deployments for rollback." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to existing URL
        working-directory: .spark-clasp
        env:
          DEPLOYMENT_ID: ${{ secrets.SPARK_DEPLOYMENT_ID }}
          NOTE: ${{ inputs.release_note }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_ID"
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$NOTE"
          clasp deployments
          {
            echo "### SPARK release"
            echo "Source: ${{ inputs.source }}"
            echo "Source commit: $(git -C ../selected-source rev-parse HEAD)"
            echo "Reason: $NOTE"
            echo "Deployment URL: https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
            echo "Inspect the published version above; validate the live UI manually before declaring success."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Accessibility smoke test
        env:
          DEPLOYMENT_ID: ${{ secrets.SPARK_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          code=$(curl --location --silent --show-error --max-time 45 --output response.html --write-out '%{http_code}' "$URL")
          echo "Anonymous GET HTTP status: $code" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != "200" ]] || grep -Eiq 'Sorry, unable to open the file at this time|You need access|Sign in to continue' response.html; then
            echo "::error::Published web app did not pass anonymous HTTP/accessibility check"
            exit 1
          fi
          echo "HTTP/accessibility probe passed. Manual browser and Uncover → Select → Build tests still required." >> "$GITHUB_STEP_SUMMARY"
